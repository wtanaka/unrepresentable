# Daily: compare live repository settings and recent merge commits with
# policy/settings.json. The read-only administration token lives in the
# separate `audit` environment, which no PR job uses. The policy tool is built
# in a job of its own with no environment and no secret and handed over as an
# artifact whose sha256 is checked, so no dependency's build script runs where
# the token is.
name: settings-audit
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # Compiles the policy tool, whose dependencies have build scripts, in a job
  # with no environment and no secret. The App's private key is only in the
  # job that runs the finished tool, after its sha256 is checked.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      policy-sha256: ${{ steps.hash.outputs.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the policy tool (base code)
        run: sh ci/cargo.sh build -p unrepresentable-policy
      - name: Hash the binary
        id: hash
        working-directory: target/release
        run: echo "policy=$(sha256sum unrepresentable-policy | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-policy
          path: target/release/unrepresentable-policy
          if-no-files-found: error
          retention-days: 1

  audit:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: audit
    permissions:
      contents: read
      issues: write
    env:
      POLICY_SHA256: ${{ needs.build.outputs.policy-sha256 }}
    steps:
      # The checkout supplies policy/settings.json; nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audit-policy
          path: policy-bin
      - name: Verify the policy tool (sha256 from the build job)
        run: |
          set -eu
          cd policy-bin
          printf '%s  unrepresentable-policy\n' "$POLICY_SHA256" | sha256sum -c -
          chmod 755 unrepresentable-policy
      - name: Compare settings
        id: audit
        continue-on-error: true
        env:
          AUDIT_TOKEN: ${{ secrets.AUDIT_TOKEN }}
        run: policy-bin/unrepresentable-policy audit policy/settings.json "$RUNNER_TEMP/drift.txt"
      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -eu
          gh label create settings-drift --color B60205 --description "Repository settings differ from policy/settings.json" 2>/dev/null || true
          existing="$(gh issue list --label settings-drift --state open --json number --jq '.[0].number // empty')"
          if [ "$AUDIT_OUTCOME" = "success" ]; then
            if [ -n "$existing" ]; then gh issue close "$existing" --comment "Settings match policy/settings.json again."; fi
          elif [ -s "$RUNNER_TEMP/drift.txt" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file "$RUNNER_TEMP/drift.txt"
            else
              gh issue create --label settings-drift --title "Settings drift detected" --body-file "$RUNNER_TEMP/drift.txt"
            fi
          else
            echo "audit failed without a drift list (token or API problem)"
          fi
      - name: Fail the run on drift or error
        if: ${{ steps.audit.outcome != 'success' }}
        run: exit 1
