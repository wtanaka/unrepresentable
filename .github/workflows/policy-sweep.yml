# On demand: re-run approval evaluation for every open PR (catches dismissed or
# changed reviews, and fork PRs for which workflow_run carries no PR number).
# Also on demand: the cargo-deny advisories check (`advisories` job). It needs the
# RustSec advisory database, so it needs the network and cannot run in the
# offline head-checks of pull requests. A new advisory can appear against a
# dependency that did not change, so it is checked by this workflow as well as on
# every push (the `deny` job of policy.yml).
name: policy-sweep
on:
  workflow_dispatch:

permissions: {}

jobs:
  # Compiles the policy tool, whose dependencies have build scripts, in a job
  # with no environment and no secret. The App's private key is only in the
  # job that runs the finished tool, after its sha256 is checked.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      policy-sha256: ${{ steps.hash.outputs.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the policy tool (base code)
        run: sh ci/cargo.sh build -p unrepresentable-policy
      - name: Hash the binary
        id: hash
        working-directory: target/release
        run: echo "policy=$(sha256sum unrepresentable-policy | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-policy
          path: target/release/unrepresentable-policy
          if-no-files-found: error
          retention-days: 1

  sweep:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: policy
    permissions:
      actions: read
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      POLICY_SHA256: ${{ needs.build.outputs.policy-sha256 }}
    steps:
      # The checkout is only the source of the policy commit the review is
      # compared with; nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sweep-policy
          path: policy-bin
      - name: Verify the policy tool (sha256 from the build job)
        run: |
          set -eu
          cd policy-bin
          printf '%s  unrepresentable-policy\n' "$POLICY_SHA256" | sha256sum -c -
          chmod 755 unrepresentable-policy
      - name: Mint App token (checks and comments; no write access to contents)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.POLICY_APP_ID }}
          private-key: ${{ secrets.POLICY_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: read
          permission-pull-requests: write
      - name: Re-evaluate every open PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
        run: policy-bin/unrepresentable-policy review ""

  # No secrets and no environment: this job runs a downloaded, pinned tool.
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the policy tool and install the pinned cargo-deny
        run: |
          set -eu
          sh ci/cargo.sh build -p unrepresentable-policy
          target/release/unrepresentable-policy install-tool policy/tools.lock cargo-deny "$RUNNER_TEMP/bin"
      - run: PATH="$RUNNER_TEMP/bin:$PATH" sh ci/checks.sh deny-advisories
