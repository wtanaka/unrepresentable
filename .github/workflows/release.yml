# Release: only for a tag pushed by a human matching v*. Binaries are built with
# `--locked`; each Linux target is built twice on separate runners and the
# release is refused unless both binaries are byte for byte the same (the
# hashes are computed again from the files here, not read from what a build
# says about itself). crates.io publishing uses trusted publishing (OIDC), no
# long-lived token. A tag is refused unless the tagged commit already passed
# the ordinary checks (`release-gate` in `verify`). Every job checks out
# `github.sha` and asserts that HEAD is that commit, so a tag that moves after
# the run started cannot change what is built. Nothing is compiled in a job
# that holds a write token or an OIDC token: `prepare` builds and checks with
# read-only contents, `assemble` only uploads what `prepare` made after
# checking its hashes again, and `publish-crate` publishes without building.
# The `release` environment must have required reviewers (see
# policy/README.md): a crates.io publish cannot be undone.
name: release
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  TAG: ${{ github.ref_name }}

jobs:
  verify:
    # A human-created tag only: bot or app senders are refused (tag creation is
    # additionally restricted to maintainers by the tag ruleset).
    if: ${{ github.event.sender.type == 'User' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require the tagged commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Tag is a version, matches Cargo.toml, and is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$' || { echo "bad tag"; exit 1; }
          version="$(sh ci/version.sh < Cargo.toml)" || { echo "no package version in Cargo.toml"; exit 1; }
          [ "v$version" = "$TAG" ] || { echo "tag does not match Cargo.toml version"; exit 1; }
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || { echo "tag is not on the default branch"; exit 1; }
      # The tagged tree is built and run here with a read-only token. That is
      # acceptable because the ancestry check above proves the tagged commit is
      # on the default branch, so its tree is trusted code, not a pull request.
      # `actions: read` lets the gate find the policy-pr workflow run of the
      # push; `checks: read` and `pull-requests: read` serve its check run and
      # push-skip lookups.
      - name: Build the policy tool from the tagged tree
        run: sh ci/cargo.sh build -p unrepresentable-policy
      - name: Refuse unless the tagged commit passed the ordinary checks
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: target/release/unrepresentable-policy release-gate "$GITHUB_SHA"

  build:
    needs: [verify]
    name: build ${{ matrix.target }} #${{ matrix.attempt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, attempt: 1}
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, attempt: 2}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, attempt: 1}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, attempt: 2}
          - {target: x86_64-apple-darwin, os: macos-15-intel, attempt: 1}
          - {target: aarch64-apple-darwin, os: macos-15, attempt: 1}
          - {target: x86_64-pc-windows-msvc, os: windows-2025, attempt: 1}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require the tagged commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build (locked, remapped paths, fixed timestamp)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          CHANNEL="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal --target "$TARGET"
          export RUSTUP_TOOLCHAIN="$CHANNEL"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
          sh ci/cargo.sh build --target "$TARGET"
          mkdir -p out
          case "$TARGET" in
            *windows*) ext=".exe" ;;
            *) ext="" ;;
          esac
          cp "target/$TARGET/release/unrepresentable$ext" "out/unrepresentable-$TARGET$ext"
          (cd out && if command -v sha256sum >/dev/null; then sha256sum "unrepresentable-$TARGET$ext"; else shasum -a 256 "unrepresentable-$TARGET$ext"; fi > "unrepresentable-$TARGET.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}-${{ matrix.attempt }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  # Checks the builds and makes everything that will be published. Contents are
  # read-only and there is no environment, so nothing compiled here (the policy
  # tool for the installer, the package check) can write to the repository or
  # publish.
  prepare:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require the tagged commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: artifacts
      - name: Refuse unless both Linux builds are the same bytes, then assemble
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$' || { echo "bad tag"; exit 1; }
          mkdir -p dist
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            ext=""
            case "$t" in *windows*) ext=".exe" ;; esac
            first="artifacts/bin-$t-1/unrepresentable-$t$ext"
            { [ -f "$first" ] && [ ! -L "$first" ]; } || { echo "no binary for $t"; exit 1; }
            # the hash a build reports about itself must be the hash of its file
            reported="$(cut -d ' ' -f 1 "artifacts/bin-$t-1/unrepresentable-$t.sha256")"
            actual="$(sha256sum "$first" | cut -d ' ' -f 1)"
            { [ -n "$actual" ] && [ "$reported" = "$actual" ]; } || { echo "the hash reported for $t is not the hash of its binary"; exit 1; }
            cp "$first" "dist/unrepresentable-$t$ext"
          done
          # the second build of each Linux target, hashed again here from its own file
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            second="artifacts/bin-$t-2/unrepresentable-$t"
            { [ -f "$second" ] && [ ! -L "$second" ]; } || { echo "no second build for $t"; exit 1; }
            a="$(sha256sum "dist/unrepresentable-$t" | cut -d ' ' -f 1)"
            b="$(sha256sum "$second" | cut -d ' ' -f 1)"
            { [ -n "$a" ] && [ "$a" = "$b" ] && cmp -s "dist/unrepresentable-$t" "$second"; } || { echo "non-reproducible build for $t"; exit 1; }
          done
          (cd dist && sha256sum unrepresentable-* > SHA256SUMS)
      - name: Build the policy tool
        run: sh ci/cargo.sh build -p unrepresentable-policy
      # A fresh advisory check for every release, whether or not the push run of
      # this commit ran its own (it can have been skipped as a duplicate of a pull
      # request that passed). Network allowed here; no secret, no write token.
      - name: Advisories (cargo-deny, pinned; the RustSec database is fetched)
        run: |
          set -eu
          target/release/unrepresentable-policy install-tool policy/tools.lock cargo-deny "$RUNNER_TEMP/bin"
          PATH="$RUNNER_TEMP/bin:$PATH" sh ci/checks.sh deny-advisories
      - name: Generate the installer
        run: target/release/unrepresentable-policy make-installer --template ci/unrepresentable.sh --sums dist/SHA256SUMS --version "${TAG#v}" --out dist/unrepresentable.sh
      - name: The crate packages and builds
        run: sh ci/checks.sh package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Creates the release from exactly the files `prepare` verified. It compiles
  # nothing, so no dependency's build script runs with a write token.
  assemble:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Check the hashes again, then create the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$' || { echo "bad tag"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          # a version with a pre-release suffix (validated above) is an alpha: the
          # release is marked as a pre-release and the notes say so
          case "${TAG#v}" in
            *-*)
              gh release create "$TAG" dist/* --verify-tag --prerelease --title "$TAG" --notes "Alpha release $TAG: formats, rules and exit behaviour may change in any release without backwards compatibility; read docs/stability.md before upgrading. Binaries, SHA256SUMS and unrepresentable.sh for $TAG. The Linux builds were reproduced on two runners."
              ;;
            *)
              gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes "Binaries, SHA256SUMS and unrepresentable.sh for $TAG. The Linux builds were reproduced on two runners."
              ;;
          esac

  # Publishes without building: `cargo publish --no-verify` runs no build
  # script, so no dependency code runs where the OIDC token is. The package was
  # built and verified in `prepare`.
  publish-crate:
    needs: [assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require the tagged commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Toolchain
        id: toolchain
        run: |
          CHANNEL="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal
          printf '%s\n' "$CHANNEL" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "unexpected channel '$CHANNEL'" >&2; exit 1; }
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
      - name: Trusted publishing token (OIDC, short-lived)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: sh ci/cargo.sh publish --no-verify
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
