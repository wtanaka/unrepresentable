# Re-evaluates human approval after a review. Default-branch file; ignores
# every field of the triggering event except the PR number.
name: policy-review
on:
  workflow_run:
    workflows: [review-signal]
    types: [completed]

permissions: {}

concurrency:
  group: policy-review
  cancel-in-progress: false

jobs:
  # Compiles the policy tool, whose dependencies have build scripts, in a job
  # with no environment and no secret. The App's private key is only in the
  # job that runs the finished tool, after its sha256 is checked.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      policy-sha256: ${{ steps.hash.outputs.policy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the policy tool (base code)
        run: sh ci/cargo.sh build -p unrepresentable-policy
      - name: Hash the binary
        id: hash
        working-directory: target/release
        run: echo "policy=$(sha256sum unrepresentable-policy | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-policy
          path: target/release/unrepresentable-policy
          if-no-files-found: error
          retention-days: 1

  review:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: policy
    permissions:
      actions: read
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      POLICY_SHA256: ${{ needs.build.outputs.policy-sha256 }}
    steps:
      # The checkout is only the source of the policy commit the review is
      # compared with; nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-policy
          path: policy-bin
      - name: Verify the policy tool (sha256 from the build job)
        run: |
          set -eu
          cd policy-bin
          printf '%s  unrepresentable-policy\n' "$POLICY_SHA256" | sha256sum -c -
          chmod 755 unrepresentable-policy
      - name: Mint App token (checks and comments; no write access to contents)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.POLICY_APP_ID }}
          private-key: ${{ secrets.POLICY_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: read
          permission-pull-requests: write
      - name: Re-evaluate approval for the exact current head
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READ_TOKEN: ${{ github.token }}
        # workflow_run names no pull request for a fork. The head commit then
        # finds it through the API; when that finds nothing, every open pull
        # request is re-evaluated (never fewer). The tool validates both values.
        run: policy-bin/unrepresentable-policy review --head-sha "$HEAD_SHA" "$PR_NUMBER"
