[package]
name = "unrepresentable"
version = "0.0.2-alpha.1"
edition = "2021"
rust-version = "1.98"
description = "An opinionated AST linter (alpha) that rejects Rust code whose types and signatures allow invalid states."
license = "MIT OR Apache-2.0"
repository = "https://github.com/wtanaka/unrepresentable"
readme = "README.md"
keywords = ["lint", "ci", "static-analysis", "syn", "agents"]
categories = ["development-tools", "command-line-utilities"]
# Root files are anchored with a leading slash: a bare name would also match
# ci/README.md and tests/README.md.
# Everything the tool and its own lint check need at runtime and nothing else.
# tests/ is left out on purpose: its helpers read the `[workspace.lints*]`
# tables of this repository's root manifest, which `cargo package` rewrites
# into per-crate `[lints]` tables, so the tests cannot pass from the unpacked
# crate. policy/, canaries/, ci/, .github/ and SECURITY.md belong to the
# repository, not to the crate.
include = [
  "src/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
  "/README.md",
  "/clippy.toml",
  "/rust-toolchain.toml",
  "/deny.toml",
  ".unrepresentable/**",
]

[lints]
workspace = true

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["cargo", "std", "error-context", "usage", "help"] }
glob = { version = "=0.3.4", default-features = false }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
syn = { version = "=2.0.119", default-features = false, features = ["full", "visit", "extra-traits", "parsing"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "std"] }

[workspace]
members = [".", "canaries/rust", "policy"]
default-members = ["."]

